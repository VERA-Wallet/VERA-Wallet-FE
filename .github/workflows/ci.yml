# CI for verawallet-fe.
#
# OFF(FE 단독 mock) 모드가 은퇴하므로, BE 계약을 만지는 레인은 반드시 실제 BE를 띄운다.
# BE는 sibling 체크아웃(고정 ref)으로 받아 VERAWALLET_BACKEND_CWD로 하네스에 넘기고,
# 하네스(tests/integration/support/server-harness.ts)가 유일한 BE 소유자로서 MOCK_MODE로 빌드·기동·헬스체크한다.
# 외부 수동 부팅은 없다.
#
# NOTE(branch protection): required status checks 지정은 GitHub 저장소 설정(외부 선행조건)이며 이 파일이 self-mark 할 수 없다.
# 아래 job 이름(lint-unit, integration, e2e)을 required checks로 등록해야 teardown 병합이 게이트된다.

name: CI

on:
  push:
    branches: [master]
  pull_request:

# 동일 BE 커밋을 모든 BE-백드 레인이 공유한다(계약의 단일 진실 소스).
env:
  BACKEND_REPO: VERA-Wallet/VERA-Wallet-BE
  BACKEND_REF: 6cb57be963bad5810ae680f08c4b76cb9f2667c4

jobs:
  # BE 불필요: 타입/린트/유닛+UI. 빠른 실패 레인.
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # jsdom 30이 끌어오는 undici 8은 `^22.22.2 || ^24.15.0 || >=26.0.0`을 요구한다.
          # Node 20에는 `webidl.util.markAsUncloneable`이 없어 vitest 워커가 통째로 못 뜬다.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: pnpm lint
      - run: pnpm test

  # BE 필요: 통합 계약 + 프록시-셰도 매트릭스. 하네스가 BE를 MOCK_MODE로 소유.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fe
      - name: Checkout backend (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ env.BACKEND_REF }}
          path: be
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # jsdom 30이 끌어오는 undici 8은 `^22.22.2 || ^24.15.0 || >=26.0.0`을 요구한다.
          # Node 20에는 `webidl.util.markAsUncloneable`이 없어 vitest 워커가 통째로 못 뜬다.
          node-version: 22
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml
      - name: Install FE deps
        working-directory: fe
        run: pnpm install --frozen-lockfile
      - name: Install BE deps
        working-directory: be
        run: pnpm install --frozen-lockfile
      - name: Verify pinned backend HEAD
        working-directory: be
        run: test "$(git rev-parse HEAD)" = "${{ env.BACKEND_REF }}"
      # 하네스가 BE를 빌드·기동한다(node dist/main.js, MOCK_MODE, /health mockMode:true).
      - name: Integration (harness-owned BE)
        working-directory: fe
        env:
          VERAWALLET_BACKEND_CWD: ${{ github.workspace }}/be
        run: pnpm test:integration
      - name: Proxy-shadow matrix (production Next vs recorder upstream)
        working-directory: fe
        run: pnpm test:proxy-shadow

  # BE 필요: ON 모드 e2e(이관된 보안 레드팀 포함). useFreshBackend()가 케이스별 BE 소유자.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fe
      - name: Checkout backend (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ env.BACKEND_REF }}
          path: be
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # jsdom 30이 끌어오는 undici 8은 `^22.22.2 || ^24.15.0 || >=26.0.0`을 요구한다.
          # Node 20에는 `webidl.util.markAsUncloneable`이 없어 vitest 워커가 통째로 못 뜬다.
          node-version: 22
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml
      - name: Install FE deps
        working-directory: fe
        run: pnpm install --frozen-lockfile
      - name: Install BE deps
        working-directory: be
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: fe
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (ON mode, harness-owned BE)
        working-directory: fe
        env:
          VERAWALLET_BACKEND_CWD: ${{ github.workspace }}/be
          VERAWALLET_BACKEND_ORIGIN: http://localhost:3200
          # BE에 /api/report-anchor가 아직 없다 — 켜 두면 g002·g003의 다운로드 케이스가 등록 실패로 타임아웃한다.
          # 부채다: BE가 계약을 구현하면 이 줄과 playwright.config.ts의 짝을 함께 지운다(계획 §8 후속 1).
          REPORT_ANCHOR_GATE: "off"
        run: pnpm test:e2e
